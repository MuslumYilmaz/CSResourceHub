name: Validate

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
      - name: Cache uv packages
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: ~/.cache/uv
          key: uv-${{ runner.os }}-${{ hashFiles('uv.lock') }}
      - name: Install locked Python dependencies
        run: |
          python -m pip install uv==0.11.28
          uv sync --frozen --extra dev
      - name: Run validation checks in parallel
        id: checks
        continue-on-error: true
        run: |
          mkdir -p tmp/validate
          uv run python scripts/validate_all.py > tmp/validate/resources.log 2>&1 &
          resources_pid=$!
          uv run pytest > tmp/validate/tests.log 2>&1 &
          tests_pid=$!
          set +e
          wait "$resources_pid"
          resources=$?
          wait "$tests_pid"
          tests=$?
          set -e
          for log in tmp/validate/*.log; do
            cat "$log"
          done
          {
            echo "resources=$resources"
            echo "tests=$tests"
          } >> "$GITHUB_OUTPUT"
          if [ "$resources" -ne 0 ] || [ "$tests" -ne 0 ]; then
            exit 1
          fi
      - name: Write validation summary
        if: always()
        run: |
          validation="FAIL"
          tests="FAIL"
          if [ "${{ steps.checks.outputs.resources }}" = "0" ]; then validation="PASS"; fi
          if [ "${{ steps.checks.outputs.tests }}" = "0" ]; then tests="PASS"; fi
          {
            echo "## Data validation"
            echo ""
            echo "| Check | Result |"
            echo "| --- | --- |"
            echo "| Resource schema and data rules | $validation |"
            echo "| Python pipeline tests | $tests |"
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Fail if validation is not healthy
        if: always()
        run: |
          if [ "${{ steps.checks.outputs.resources }}" != "0" ] || [ "${{ steps.checks.outputs.tests }}" != "0" ]; then
            exit 1
          fi
