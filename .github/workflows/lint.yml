name: Lint

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
      - name: Cache uv packages
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: ~/.cache/uv
          key: uv-${{ runner.os }}-${{ hashFiles('uv.lock') }}
      - name: Install locked Python dependencies
        run: |
          python -m pip install uv==0.11.28
          uv sync --frozen --extra dev
      - name: Run lint checks in parallel
        id: checks
        continue-on-error: true
        run: |
          mkdir -p tmp/lint
          uv run ruff check scripts/ tests/ notebooks/ > tmp/lint/ruff.log 2>&1 &
          ruff_pid=$!
          uv run python scripts/lint_json.py > tmp/lint/json.log 2>&1 &
          json_pid=$!
          (
            curl -fsSLo /tmp/actionlint.tar.gz https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_linux_amd64.tar.gz &&
            echo "8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8  /tmp/actionlint.tar.gz" | sha256sum --check &&
            tar -xzf /tmp/actionlint.tar.gz -C /tmp actionlint &&
            /tmp/actionlint
          ) > tmp/lint/actionlint.log 2>&1 &
          actionlint_pid=$!
          set +e
          wait "$ruff_pid"
          ruff=$?
          wait "$json_pid"
          json=$?
          wait "$actionlint_pid"
          actionlint=$?
          set -e
          for log in tmp/lint/*.log; do
            cat "$log"
          done
          {
            echo "ruff=$ruff"
            echo "json=$json"
            echo "actionlint=$actionlint"
          } >> "$GITHUB_OUTPUT"
          if [ "$ruff" -ne 0 ] || [ "$json" -ne 0 ] || [ "$actionlint" -ne 0 ]; then
            exit 1
          fi
      - name: Write lint summary
        if: always()
        run: |
          ruff="FAIL"
          json="FAIL"
          actions="FAIL"
          if [ "${{ steps.checks.outputs.ruff }}" = "0" ]; then ruff="PASS"; fi
          if [ "${{ steps.checks.outputs.json }}" = "0" ]; then json="PASS"; fi
          if [ "${{ steps.checks.outputs.actionlint }}" = "0" ]; then actions="PASS"; fi
          {
            echo "## Lint"
            echo ""
            echo "| Check | Result |"
            echo "| --- | --- |"
            echo "| Python style with Ruff | $ruff |"
            echo "| JSON formatting | $json |"
            echo "| GitHub Actions semantics | $actions |"
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Fail if lint is not healthy
        if: always()
        run: |
          if [ "${{ steps.checks.outputs.ruff }}" != "0" ] || [ "${{ steps.checks.outputs.json }}" != "0" ] || [ "${{ steps.checks.outputs.actionlint }}" != "0" ]; then
            exit 1
          fi
